name: Bug report
description: Something is broken or behaves differently than documented.
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.

        **Do not paste your bot token, `.env` contents, or real user data.** Redact them before submitting.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: "e.g. v1.0.0 or a1b2c3d"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the problem.
      placeholder: |
        1. Run `npm start`
        2. Use `/...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error message or stack trace if there is one.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and whether the bot runs in Docker.
      placeholder: "Ubuntu 24.04 · Node 22 · npm start"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed tokens, `.env` values, and personal data from this report.
          required: true
